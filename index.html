<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Popup Video Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    
    #video-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* Prevent any interaction that might pause/stop the video */
    #video::-webkit-media-controls {
      display: none !important;
    }
    
    #video::-webkit-media-controls-enclosure {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" playsinline></video>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    const video = document.getElementById('video');
    let videoPath = '';
    
    // Receive video path from main process
    ipcRenderer.on('video-path', (event, path) => {
      videoPath = path;
      video.src = path;
    });
    
    // Play video when triggered
    ipcRenderer.on('play-video', () => {
      console.log('Playing video from:', video.src);
      video.currentTime = 0;
      video.play().then(() => {
        console.log('Video started playing');
      }).catch(err => {
        console.error('Failed to play video:', err);
        // If video fails, close after 3 seconds
        setTimeout(() => {
          ipcRenderer.send('video-ended');
        }, 3000);
      });
    });
    
    // Notify main process when video ends
    video.addEventListener('ended', () => {
      console.log('Video ended');
      ipcRenderer.send('video-ended');
    });
    
    // Also handle error
    video.addEventListener('error', (e) => {
      console.error('Video error:', e);
      setTimeout(() => {
        ipcRenderer.send('video-ended');
      }, 3000);
    });
    
    // Prevent pausing the video
    video.addEventListener('pause', () => {
      // If video was paused but not ended, resume it
      if (video.currentTime < video.duration && video.currentTime > 0) {
        video.play().catch(() => {});
      }
    });
    
    // Prevent right-click context menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });
    
    // Prevent keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Prevent Escape from exiting fullscreen during video
      if (e.key === 'Escape') {
        e.preventDefault();
      }
      // Prevent space from pausing
      if (e.key === ' ') {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
